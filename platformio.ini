; ============================================================
; ESP32-S3 Dual Display — RC Ultra4 Dashboard + Waypoint Navigator
; ============================================================
[platformio]
; `pio run` builds only the firmware; the native env is test-only
; (`pio test -e native`) and has no main of its own.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed    = 921600

board_build.usb_mode              = 1
board_upload.use_1200bps_touch    = yes
board_upload.wait_for_upload_port = yes

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -O2

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16

; Tests run on the native env only (pio test -e native)
test_ignore = *

; CRITICAL: +<*> alone only catches root-level files in some PIO versions.
; List subdirs explicitly so core/app/hal are always linked.
build_src_filter =
    +<*>
    +<core/*.cpp>
    +<hal/*.cpp>
    +<app/*.cpp>

; ---- Host-compiled unit tests (no Arduino / LovyanGFX) ----
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -I src
    -I include
; Only compile core — no hal, no app
build_src_filter =
    +<core/simulator.cpp>
    +<core/roadbook.cpp>
    +<core/formatter.cpp>
    +<core/driver.cpp>
    +<core/race.cpp>
